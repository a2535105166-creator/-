name: Deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Harden live API connection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const API_BASE = String(window.JIKE_API_BASE || '').replace(/\\/$/, '');", "const API_BASE = String(window.JIKE_API_BASE || 'https://api.jikeyun.cn').replace(/\\/$/, '');")
          old="const r = await fetch(apiUrl(url), { headers:{'Content-Type':'application/json'}, ...options });"
          new="const opts={cache:'no-store',...options}; if(opts.body){opts.headers={'Content-Type':'application/json',...(opts.headers||{})};} const r = await fetch(apiUrl(url), opts);"
          if old in s:
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Diagnose formal API domain
        shell: bash
        run: |
          set +e
          echo '=== DNS api.jikeyun.cn ==='
          getent ahostsv4 api.jikeyun.cn || true
          echo '=== HTTPS api.jikeyun.cn ==='
          curl -vk --connect-timeout 8 --max-time 20 https://api.jikeyun.cn/api/status 2>&1 | tail -n 40 || true

      - name: Force fresh frontend assets
        shell: bash
        run: |
          VERSION="${GITHUB_SHA}"
          sed -i "s#./config.js#./config.js?v=${VERSION}#g" index.html
          sed -i "s#./app.js#./app.js?v=${VERSION}#g" index.html
          sed -i "s#./styles.css#./styles.css?v=${VERSION}#g" index.html
          sed -i "s#./wechat-studio.js#./wechat-studio.js?v=${VERSION}#g" index.html
          sed -i "s#./wechat-studio.css#./wechat-studio.css?v=${VERSION}#g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
