name: Deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Force fresh frontend assets
        shell: bash
        run: |
          VERSION="${GITHUB_SHA}"
          sed -i "s#./config.js#./config.js?v=${VERSION}#g" index.html
          sed -i "s#./app.js#./app.js?v=${VERSION}#g" index.html
          sed -i "s#./styles.css#./styles.css?v=${VERSION}#g" index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
