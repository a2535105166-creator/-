name: Deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Diagnose formal API domain
        shell: bash
        run: |
          set +e
          echo '=== DNS api.jikeyun.cn ==='
          getent ahostsv4 api.jikeyun.cn || true
          echo '=== HTTPS api.jikeyun.cn ==='
          curl -vk --connect-timeout 8 --max-time 20 https://api.jikeyun.cn/api/status 2>&1 | tail -n 40 || true

      - name: Force fresh frontend assets
        shell: bash
        run: |
          VERSION="${GITHUB_SHA}"
          sed -i "s#./config.js#./config.js?v=${VERSION}#g" index.html
          sed -i "s#./app.js#./app.js?v=${VERSION}#g" index.html
          sed -i "s#./styles.css#./styles.css?v=${VERSION}#g" index.html
          sed -i "s#./wechat-studio.js#./wechat-studio.js?v=${VERSION}#g" index.html
          sed -i "s#./wechat-studio.css#./wechat-studio.css?v=${VERSION}#g" index.html
          sed -i "s#./editor-plus.css#./editor-plus.css?v=${VERSION}#g" index.html
          sed -i "s#./agent-studio.js#./agent-studio.js?v=${VERSION}#g" index.html
          sed -i "s#./agent-studio.css#./agent-studio.css?v=${VERSION}#g" agent-studio.js || true

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
