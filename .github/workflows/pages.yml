name: Deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Harden live API connection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const API_BASE = String(window.JIKE_API_BASE || '').replace(/\\/$/, '');", "const API_BASE = String(window.JIKE_API_BASE || 'https://115-190-56-127.sslip.io').replace(/\\/$/, '');")
          old="const r = await fetch(apiUrl(url), { headers:{'Content-Type':'application/json'}, ...options });"
          new="const opts={cache:'no-store',...options}; if(opts.body){opts.headers={'Content-Type':'application/json',...(opts.headers||{})};} const r = await fetch(apiUrl(url), opts);"
          if old in s:
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Diagnose live backend
        shell: bash
        run: |
          set +e
          echo '=== DNS ==='
          getent ahosts 115-190-56-127.sslip.io || true
          echo '=== TCP 80 ==='
          timeout 8 bash -c '</dev/tcp/115.190.56.127/80' && echo 'TCP80 OK' || echo 'TCP80 FAIL'
          echo '=== TCP 443 ==='
          timeout 8 bash -c '</dev/tcp/115.190.56.127/443' && echo 'TCP443 OK' || echo 'TCP443 FAIL'
          echo '=== HTTP BY IP ==='
          curl -v --connect-timeout 8 --max-time 15 http://115.190.56.127/api/status 2>&1 | tail -n 30 || true
          echo '=== HTTPS WITH SNI ==='
          curl -vk --resolve 115-190-56-127.sslip.io:443:115.190.56.127 --connect-timeout 8 --max-time 20 https://115-190-56-127.sslip.io/api/status 2>&1 | tail -n 50 || true
          echo '=== TLS HANDSHAKE ==='
          timeout 15 openssl s_client -connect 115.190.56.127:443 -servername 115-190-56-127.sslip.io -brief </dev/null 2>&1 | tail -n 40 || true
          echo '=== CORS GET ==='
          curl -sS --connect-timeout 8 --max-time 20 -D - -o /tmp/status.json -H 'Origin: https://a2535105166-creator.github.io' https://115-190-56-127.sslip.io/api/status || true
          cat /tmp/status.json 2>/dev/null || true
          echo
          echo '=== CORS OPTIONS ==='
          curl -sS --connect-timeout 8 --max-time 20 -D - -o /dev/null -X OPTIONS -H 'Origin: https://a2535105166-creator.github.io' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' https://115-190-56-127.sslip.io/api/generate || true

      - name: Force fresh frontend assets
        shell: bash
        run: |
          VERSION="${GITHUB_SHA}"
          sed -i "s#./config.js#./config.js?v=${VERSION}#g" index.html
          sed -i "s#./app.js#./app.js?v=${VERSION}#g" index.html
          sed -i "s#./styles.css#./styles.css?v=${VERSION}#g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
